<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Feliz cumpleaños, mi amor!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Courier New", monospace;
      background:
        linear-gradient(#ffd6f3, #b7e9ff);
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #3b2458;
    }

    .scene {
      width: 100%;
      max-width: 430px;
      min-height: 720px;
      background: #fff8c9;
      border: 6px solid #3b2458;
      box-shadow: 8px 8px 0 #3b2458;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 35px 18px;
    }

    h1 {
      font-size: clamp(2rem, 9vw, 3.5rem);
      line-height: 1;
      color: #ff4fa3;
      text-shadow:
        3px 3px 0 #3b2458,
        5px 5px 0 #ffc857;
      animation: pop 1.4s infinite ease-in-out;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: clamp(1rem, 4vw, 1.25rem);
      background: #ffffff;
      border: 4px solid #3b2458;
      box-shadow: 4px 4px 0 #3b2458;
      padding: 12px;
      margin: 0 auto 30px;
      max-width: 330px;
    }

    .cake {
      width: 220px;
      height: 190px;
      margin: 20px auto;
      position: relative;
      image-rendering: pixelated;
    }

    .plate {
      width: 210px;
      height: 22px;
      background: #3b2458;
      position: absolute;
      bottom: 0;
      left: 5px;
      border-radius: 2px;
    }

    .cake-base {
      width: 180px;
      height: 80px;
      background: #ff8ac7;
      position: absolute;
      bottom: 20px;
      left: 20px;
      border: 5px solid #3b2458;
      box-shadow: inset 0 -15px 0 #ff5cab;
    }

    .cake-top {
      width: 150px;
      height: 60px;
      background: #8ee6ff;
      position: absolute;
      bottom: 95px;
      left: 35px;
      border: 5px solid #3b2458;
      box-shadow: inset 0 -12px 0 #48c7e8;
    }

    .frosting {
      width: 150px;
      height: 18px;
      background: #ffffff;
      position: absolute;
      bottom: 137px;
      left: 35px;
      border: 5px solid #3b2458;
    }

    .frosting::before,
    .frosting::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 4px solid #3b2458;
      top: 8px;
    }

    .frosting::before {
      left: 25px;
    }

    .frosting::after {
      right: 25px;
    }

    .candle {
      width: 18px;
      height: 50px;
      background: repeating-linear-gradient(
        45deg,
        #ffffff 0 6px,
        #ff4fa3 6px 12px
      );
      border: 4px solid #3b2458;
      position: absolute;
      bottom: 155px;
      left: 101px;
    }

    .flame {
      width: 22px;
      height: 22px;
      background: #ffc857;
      border: 4px solid #3b2458;
      position: absolute;
      bottom: 204px;
      left: 99px;
      transform: rotate(45deg);
      animation: flicker 0.45s infinite alternate;
      box-shadow: 0 0 12px #ff8c00;
    }

    .cake-face {
      position: absolute;
      bottom: 50px;
      left: 72px;
      font-size: 30px;
      letter-spacing: 12px;
    }

    .message {
      margin: 30px auto 20px;
      font-size: clamp(1rem, 4.3vw, 1.25rem);
      line-height: 1.5;
      background: #ffffff;
      border: 4px solid #3b2458;
      box-shadow: 5px 5px 0 #3b2458;
      padding: 16px;
      max-width: 350px;
    }

    .button {
      margin-top: 18px;
      border: 4px solid #3b2458;
      background: #ffc857;
      color: #3b2458;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      padding: 14px 18px;
      box-shadow: 5px 5px 0 #3b2458;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .button:active {
      transform: translate(5px, 5px);
      box-shadow: none;
    }

    .balloon {
      width: 38px;
      height: 48px;
      border: 4px solid #3b2458;
      border-radius: 50% 50% 45% 45%;
      position: absolute;
      animation: float 4s infinite ease-in-out;
    }

    .balloon::after {
      content: "";
      width: 3px;
      height: 70px;
      background: #3b2458;
      position: absolute;
      top: 45px;
      left: 15px;
    }

    .balloon.one {
      background: #ff4fa3;
      left: 20px;
      top: 90px;
      animation-delay: 0s;
    }

    .balloon.two {
      background: #8ee6ff;
      right: 20px;
      top: 130px;
      animation-delay: 1s;
    }

    .balloon.three {
      background: #ffc857;
      left: 45px;
      top: 250px;
      animation-delay: 2s;
    }

    .pixel-heart {
      width: 12px;
      height: 12px;
      background: #ff4fa3;
      position: absolute;
      animation: rise 5s linear infinite;
      box-shadow:
        12px 0 #ff4fa3,
        -12px 12px #ff4fa3,
        0 12px #ff4fa3,
        12px 12px #ff4fa3,
        24px 12px #ff4fa3,
        -12px 24px #ff4fa3,
        0 24px #ff4fa3,
        12px 24px #ff4fa3,
        24px 24px #ff4fa3,
        0 36px #ff4fa3,
        12px 36px #ff4fa3;
    }

    .heart1 {
      bottom: -60px;
      left: 15%;
      animation-delay: 0s;
    }

    .heart2 {
      bottom: -80px;
      left: 70%;
      animation-delay: 1.5s;
    }

    .heart3 {
      bottom: -70px;
      left: 45%;
      animation-delay: 3s;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff4fa3;
      top: -20px;
      animation: fall 3s linear infinite;
    }

    .confetti:nth-child(1) { left: 10%; animation-delay: 0s; background: #ff4fa3; }
    .confetti:nth-child(2) { left: 25%; animation-delay: .4s; background: #8ee6ff; }
    .confetti:nth-child(3) { left: 40%; animation-delay: .8s; background: #ffc857; }
    .confetti:nth-child(4) { left: 55%; animation-delay: 1.2s; background: #a6ff7a; }
    .confetti:nth-child(5) { left: 70%; animation-delay: 1.6s; background: #ff8ac7; }
    .confetti:nth-child(6) { left: 85%; animation-delay: 2s; background: #b08cff; }

    @keyframes pop {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    @keyframes flicker {
      from {
        transform: rotate(45deg) scale(1);
        background: #ffc857;
      }
      to {
        transform: rotate(45deg) scale(1.18);
        background: #ff8c00;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-18px);
      }
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.75);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-720px) scale(1);
        opacity: 0;
      }
    }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(800px) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 380px) {
      .scene {
        min-height: 680px;
        padding: 30px 12px;
      }

      .cake {
        transform: scale(0.88);
        margin: 0 auto;
      }

      .message {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="balloon one"></div>
    <div class="balloon two"></div>
    <div class="balloon three"></div>

    <div class="pixel-heart heart1"></div>
    <div class="pixel-heart heart2"></div>
    <div class="pixel-heart heart3"></div>

    <h1>HAPPY<br>BIRTHDAY!</h1>

    <p class="subtitle">
      Otra verano juntos otra vuelta al sol.
    </p>

    <section class="cake" aria-label="Pixel art birthday cake">
      <div class="flame"></div>
      <div class="candle"></div>
      <div class="frosting"></div>
      <div class="cake-top"></div>
      <div class="cake-base"></div>
      <div class="cake-face">• •</div>
      <div class="plate"></div>
    </section>

    <div class="message" id="birthdayMessage">
      ¡Deseando que tengas un día lleno de alegría, dulces sorpresas y de amor!
      Que este año te traiga felicidad, amor y hermosos recuerdos.
    </div>

    <button class="button" onclick="changeMessage()">
      Descubre otro mensajito. ♡
    </button>
  </main>

  <script>
    const wishes = [
      "¡Eres amada más de lo que sabes! ¡Feliz cumpleaños!",
      "Que tu día brille como las estrellas y se sienta tan dulce como el pastel.",
      "Otro año, otro nivel desbloqueado. ¡Feliz cumpleaños, mi cielo!",
      "Te amo, con todo mi corazón. ¡Feliz cumpleaños, mi vida!",
      "Que este nuevo año de tu vida sea tu mejor aventura hasta ahora."
    ];

    let index = 0;

    function changeMessage() {
      const message = document.getElementById("birthdayMessage");
      index = (index + 1) % wishes.length;

      message.style.transform = "scale(0.95)";
      message.style.opacity = "0.4";

      setTimeout(() => {
        message.textContent = wishes[index];
        message.style.transform = "scale(1)";
        message.style.opacity = "1";
      }, 180);
    }
  </script>
</body>
</html>
